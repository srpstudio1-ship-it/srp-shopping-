<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2874f0">
    <meta name="description" content="SRP Shopping original multi-vendor marketplace storefront with Razorpay, UPI, Webhooks & Live Shipping">
    <title>SRP Shopping — Multi-Vendor Marketplace</title>
    <style>
:root {
    --blue: #2874f0;
    --blue-2: #1458c9;
    --yellow: #ffd814;
    --yellow-2: #f5bd00;
    --orange: #ff8f00;
    --green: #07895a;
    --red: #d92d20;
    --ink: #172033;
    --muted: #667085;
    --surface: #f5f7fb;
    --paper: #ffffff;
    --line: #e3e7ef;
    --soft-blue: #eef4ff;
    --soft-yellow: #fff8df;
    --soft-green: #eaf8f2;
    --soft-red: #feeceb;
    --shadow: 0 14px 36px rgba(15, 23, 42, .09);
    --radius: 14px;
    --container: 1440px;
    --header: 128px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; min-width: 320px; background: var(--surface); color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
}
body.dark {
    --ink: #edf2f7; --muted: #9da8ba; --surface: #0d1420; --paper: #182131;
    --line: #2c3546; --soft-blue: #1b2b46; --soft-yellow: #302915; --soft-green: #173329; --soft-red: #372321;
}
body.no-scroll { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
.hidden { display: none !important; }
.container { width: min(var(--container), calc(100% - 40px)); margin-inline: auto; }
.topline {
    min-height: 33px; padding: 6px 12px; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(90deg, #174ea6, #2874f0, #3c83f5); color: #fff; font-size: 11px; font-weight: 800;
}
.header { position: sticky; top: 0; z-index: 80; background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: 0 5px 22px rgba(15, 23, 42, .07); }
.header-main { min-height: 74px; display: grid; grid-template-columns: auto minmax(300px, 1fr) auto; align-items: center; gap: 16px; }
.brand { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.brand-mark { color: var(--blue); font-size: 30px; line-height: 1; font-style: italic; font-weight: 950; letter-spacing: -2px; }
.brand-sub { color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: 2px; }
.search { position: relative; min-width: 0; }
.search-box { width: 100%; height: 45px; padding: 0 48px 0 43px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); outline: 0; }
.search-box:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40, 116, 240, .1); }
.search-icon { position: absolute; left: 14px; top: 11px; color: var(--muted); font-size: 20px; pointer-events: none; }
.search-button { position: absolute; right: 5px; top: 5px; width: 35px; height: 35px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; }
.suggestions { position: absolute; top: 51px; left: 0; right: 0; z-index: 120; overflow: hidden; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.suggestion { width: 100%; display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; padding: 11px 13px; border: 0; border-bottom: 1px solid #edf0f5; background: var(--paper); color: var(--ink); text-align: left; }
.suggestion:hover { background: var(--soft-blue); }
.suggestion-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--soft-blue); }
.suggestion-name { font-size: 12px; font-weight: 850; }
.suggestion-meta { color: var(--muted); font-size: 10px; }
.header-actions { display: flex; align-items: center; gap: 5px; }
.header-action { position: relative; min-width: 42px; height: 42px; padding: 0 9px; border: 1px solid transparent; border-radius: 9px; display: grid; place-items: center; background: transparent; color: var(--ink); }
.header-action:hover { background: var(--surface); border-color: var(--line); }
.badge { position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; border-radius: 999px; background: var(--yellow); color: #111; font-size: 9px; font-weight: 950; }
.account-button { display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid transparent; background: transparent; color: var(--ink); border-radius: 9px; }
.account-button:hover { border-color: var(--line); background: var(--surface); }
.account-title { display: block; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 900; text-align: left; }
.account-subtitle { display: block; margin-top: 1px; color: var(--muted); font-size: 9px; text-align: left; }
.category-strip { min-height: 48px; display: flex; align-items: center; gap: 5px; overflow-x: auto; border-top: 1px solid #f0f1f5; }
.category-strip::-webkit-scrollbar { display: none; }
.category-button { min-width: max-content; display: inline-flex; align-items: center; gap: 6px; padding: 10px 13px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 11px; font-weight: 850; }
.category-button:hover, .category-button.active { background: var(--soft-blue); color: var(--blue); }
.page { min-height: 60vh; }
.page-shell { padding-block: 20px 44px; }
.hero { position: relative; min-height: 435px; overflow: hidden; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; border-radius: 20px; background: linear-gradient(130deg, #eef5ff 0%, #fff 55%, #fff7d8 100%); border: 1px solid var(--line); }
.hero::after { content: ""; position: absolute; width: 450px; height: 450px; right: -170px; bottom: -180px; border-radius: 50%; background: rgba(40, 116, 240, .08); }
.hero-copy { position: relative; z-index: 2; padding: 52px 54px; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--blue); font-size: 10px; font-weight: 950; letter-spacing: 1.7px; text-transform: uppercase; }
.hero h1 { margin: 12px 0 15px; max-width: 700px; font-size: clamp(40px, 5vw, 68px); line-height: 1.02; letter-spacing: -3px; }
.hero h1 strong { color: var(--blue); }
.hero p { max-width: 600px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.hero-visual { position: relative; min-height: 435px; background: radial-gradient(circle at 35% 32%, #fff 0 11%, transparent 11.5%), radial-gradient(circle at 65% 66%, rgba(40,116,240,.22), transparent 30%), radial-gradient(circle at 75% 28%, rgba(255,216,20,.55), transparent 24%), linear-gradient(145deg, #dce9ff, #fff2b7); }
.hero-card { position: absolute; width: 300px; min-height: 320px; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(3deg); padding: 22px; border-radius: 23px; background: rgba(255,255,255,.93); box-shadow: 0 27px 60px rgba(15,23,42,.17); border: 1px solid rgba(255,255,255,.9); }
.hero-card-product { height: 185px; display: grid; place-items: center; overflow: hidden; border-radius: 16px; background: #f2f5fa; }
.hero-card-product img { width: 100%; height: 100%; object-fit: contain; }
.hero-card-label { margin-top: 14px; color: var(--orange); font-size: 9px; font-weight: 950; letter-spacing: 1.2px; }
.hero-card h3 { margin: 6px 0 4px; font-size: 19px; }
.hero-card small { color: var(--muted); font-size: 10px; }
.btn { min-height: 40px; padding: 0 15px; border: 0; border-radius: 8px; font-size: 11px; font-weight: 900; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-2); }
.btn-accent { background: var(--yellow); color: #111; }
.btn-accent:hover { background: #f5ca18; }
.btn-outline { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.btn-outline:hover { border-color: #bbcbe7; background: var(--soft-blue); }
.btn-ghost { background: var(--soft-blue); color: var(--blue); }
.btn-success { background: var(--soft-green); color: var(--green); }
.btn-danger { background: var(--soft-red); color: var(--red); }
.btn:disabled { cursor: not-allowed; opacity: .45; }
.service-row { display: grid; grid-template-columns: repeat(4,1fr); margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); box-shadow: var(--shadow); }
.service { display: flex; gap: 10px; padding: 18px; border-right: 1px solid var(--line); }
.service:last-child { border-right: 0; }
.service-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--soft-blue); }
.service-title { font-size: 11px; font-weight: 950; }
.service-copy { margin-top: 2px; color: var(--muted); font-size: 9px; }
.section { margin-top: 34px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
.section-title { margin: 3px 0 0; font-size: 26px; letter-spacing: -.7px; }
.section-copy { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
.category-grid { display: grid; grid-template-columns: repeat(8,1fr); gap: 10px; }
.category-card { min-height: 118px; display: grid; place-items: center; align-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); transition: .18s ease; }
.category-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.category-icon { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 14px; background: var(--soft-blue); font-size: 25px; }
.category-name { font-size: 10px; font-weight: 900; }
.deal-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.deal-card { position: relative; overflow: hidden; min-height: 170px; padding: 20px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
.deal-card::after { content: ""; position: absolute; width: 100px; height: 100px; right: -35px; bottom: -35px; border-radius: 50%; background: var(--soft-blue); }
.deal-label { color: var(--orange); font-size: 9px; font-weight: 950; letter-spacing: 1.2px; }
.deal-card h3 { margin: 8px 0 5px; font-size: 18px; }
.deal-card p { margin: 0; max-width: 250px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.deal-card .btn { margin-top: 15px; position: relative; z-index: 2; }
.products-bar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin-bottom: 14px; }
.product-count { color: var(--muted); font-size: 11px; }
.toolbar { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.select { height: 39px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--paper); color: var(--ink); font-size: 11px; }
.filters-layout { display: grid; grid-template-columns: 235px 1fr; gap: 15px; }
.filter-panel { align-self: start; position: sticky; top: 143px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.filter-block { padding: 13px 0; border-bottom: 1px solid var(--line); }
.filter-block:last-child { border-bottom: 0; }
.filter-label { font-size: 11px; font-weight: 950; }
.filter-options { display: grid; gap: 8px; margin-top: 9px; }
.filter-row { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
.price-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
.input { width: 100%; min-height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--paper); color: var(--ink); font-size: 11px; }
textarea.input { min-height: 100px; padding-block: 10px; resize: vertical; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(40,116,240,.09); }
.product-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 13px; }
.product-grid.list { grid-template-columns: 1fr; }
.product-card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); transition: .18s ease; }
.product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.product-grid.list .product-card { display: grid; grid-template-columns: 190px 1fr; }
.product-media { position: relative; height: 230px; padding: 16px; display: grid; place-items: center; background: #f6f8fc; }
.product-media img { width: 100%; height: 100%; object-fit: contain; }
.product-wish, .product-compare { position: absolute; top: 9px; z-index: 5; width: 33px; height: 33px; display: grid; place-items: center; border: 1px solid #e1e5ed; border-radius: 50%; background: #fff; color: #667085; }
.product-wish { right: 9px; }
.product-compare { left: 9px; }
.product-wish.active { color: #e11d48; }
.product-compare.active { color: var(--blue); }
.product-body { padding: 13px; }
.product-brand { color: var(--blue); font-size: 9px; font-weight: 950; letter-spacing: 1px; text-transform: uppercase; }
.product-name { min-height: 43px; margin-top: 5px; font-size: 13px; font-weight: 850; line-height: 1.45; }
.rating-pill { display: inline-flex; padding: 3px 6px; border-radius: 4px; background: var(--green); color: #fff; font-size: 9px; font-weight: 950; }
.price { margin-top: 8px; font-size: 19px; font-weight: 950; }
.mrp { margin-left: 5px; color: #939cad; font-size: 10px; text-decoration: line-through; font-weight: 500; }
.discount { margin-left: 5px; color: var(--green); font-size: 10px; font-weight: 950; }
.product-seller { min-height: 15px; margin-top: 5px; color: var(--muted); font-size: 9px; }
.product-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.product-buttons .btn { min-height: 36px; padding-inline: 8px; font-size: 10px; }
.pagination { display: flex; justify-content: center; gap: 5px; margin-top: 18px; }
.page-btn { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font-size: 10px; font-weight: 900; }
.page-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.seller-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.seller-card { padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
.seller-avatar { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 13px; background: var(--soft-blue); color: var(--blue); font-size: 18px; font-weight: 950; }
.seller-name { margin-top: 11px; font-size: 13px; font-weight: 950; }
.seller-meta { margin-top: 4px; color: var(--muted); font-size: 10px; }
.seller-buttons { display: flex; gap: 6px; margin-top: 13px; }
.seller-buttons .btn { flex: 1; padding-inline: 7px; font-size: 9px; }
.recent-card { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; }
.panel { padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.empty { display: grid; place-items: center; min-height: 250px; text-align: center; }
.empty-icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 18px; background: var(--soft-blue); font-size: 28px; }
.empty-title { margin-top: 13px; font-size: 16px; font-weight: 950; }
.empty-copy { max-width: 500px; margin: 5px auto 0; color: var(--muted); font-size: 10px; }
.footer { margin-top: 45px; background: #111827; color: #dbe4f1; }
.footer-main { padding: 48px 0; }
.footer-grid { display: grid; grid-template-columns: 1.7fr repeat(4,1fr); gap: 28px; }
.footer-col { display: grid; gap: 9px; align-content: start; }
.footer-col h3 { margin: 0 0 2px; color: #fff; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.footer-col a { color: #aeb8c8; font-size: 10px; }
.footer-col a:hover { color: #fff; }
.footer-bottom { padding: 17px 0; border-top: 1px solid rgba(255,255,255,.1); color: #8f9caf; font-size: 9px; }
.drawer-wrap, .modal-wrap { position: fixed; inset: 0; z-index: 200; background: rgba(2,6,23,.61); backdrop-filter: blur(5px); }
.drawer { position: absolute; top: 0; right: 0; width: min(520px,100%); height: 100%; display: grid; grid-template-rows: auto 1fr auto; background: var(--paper); box-shadow: -18px 0 45px rgba(0,0,0,.2); }
.drawer-head, .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 17px 19px; border-bottom: 1px solid var(--line); background: var(--paper); }
.drawer-title, .modal-title { margin: 0; font-size: 17px; }
.close { width: 34px; height: 34px; border: 0; border-radius: 8px; background: var(--surface); color: var(--ink); }
.drawer-body { overflow: auto; padding: 17px 19px; }
.drawer-foot { padding: 16px 19px; border-top: 1px solid var(--line); background: var(--paper); }
.cart-line { display: grid; grid-template-columns: 68px 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cart-line img { width: 68px; height: 68px; padding: 5px; border-radius: 9px; object-fit: contain; background: #f4f6fa; }
.cart-name { font-size: 11px; font-weight: 900; }
.cart-meta { margin-top: 4px; color: var(--muted); font-size: 9px; }
.qty { display: inline-flex; align-items: center; margin-top: 8px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }

.qty span { min-width: 30px; text-align: center; font-size: 10px; font-weight: 900; }
.cart-totals { display: grid; gap: 5px; }
.total-row { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; }
.total-row.grand { margin-top: 5px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 17px; font-weight: 950; }
.modal-wrap { display: grid; place-items: center; padding: 18px; }
.modal { width: min(780px,100%); max-height: 94vh; overflow: auto; border-radius: 15px; background: var(--paper); box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.modal.wide { width: min(1160px,100%); }
.modal-body { padding: 20px; }
.product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.gallery { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
.thumb-list { display: grid; align-content: start; gap: 7px; }
.thumb { width: 72px; height: 72px; padding: 5px; border: 1px solid var(--line); border-radius: 9px; background: #f7f9fc; }
.thumb.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(40,116,240,.1); }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.main-image { min-height: 450px; padding: 22px; display: grid; place-items: center; border-radius: 13px; background: #f6f8fc; }
.main-image img { width: 100%; height: 100%; max-height: 420px; object-fit: contain; }
.detail-brand { color: var(--blue); font-size: 9px; font-weight: 950; letter-spacing: 1.3px; text-transform: uppercase; }
.detail-title { margin: 7px 0 9px; font-size: 29px; line-height: 1.1; }

.detail-price { margin-top: 17px; font-size: 30px; font-weight: 950; }
.detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 16px; }
.source-box { margin-top: 16px; padding: 12px; border-radius: 9px; background: var(--soft-yellow); color: #6a591c; font-size: 9px; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
.info-box { padding: 12px; border: 1px solid var(--line); border-radius: 9px; }

.review { padding: 13px 0; border-bottom: 1px solid var(--line); }

.review-stars { color: #f59e0b; }
.review-title { margin-top: 4px; font-size: 11px; font-weight: 900; }
.review-text { margin-top: 4px; color: var(--muted); font-size: 10px; }
.checkout-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 17px; }

.address-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form { display: grid; gap: 11px; }

.stepper { display: flex; gap: 5px; margin-bottom: 17px; }

.payment-card input { grid-area: radio; margin-top: 2px; }
.payment-title { grid-area: title; font-size: 11px; font-weight: 950; }

                    app.innerHTML = renderCartPage();
                } else if (pageId === "checkout") {
                    app.innerHTML = renderCheckoutPage();
                } else if (pageId === "account") {
                    app.innerHTML = renderAccountPage();
                } else if (pageId === "admin") {
                    app.innerHTML = renderAdminPage();
                } else if (pageId === "seller") {
                    app.innerHTML = renderSellerPage();
                } else if (pageId === "detail" && param) {
                    app.innerHTML = renderDetailPage(param);
                }
            },
            scrollTo(id) {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            }
        };

        function updateBadges() {
            document.getElementById("cartBadge").textContent = db.cart.reduce((a, c) => a + c.qty, 0);
            document.getElementById("wishlistBadge").textContent = db.wishlist.length;
            document.getElementById("compareBadge").textContent = db.compare.length;
            const unreadCount = db.notifications.filter(n => n.unread).length;
            document.getElementById("notificationBadge").textContent = unreadCount;
            document.getElementById("accountTitle").textContent = db.user.name.split(" ")[0];
            document.getElementById("pinHeader").textContent = db.pincode;
        }

        document.getElementById("themeButton").addEventListener("click", () => {
            document.body.classList.toggle("dark");
            db.theme = document.body.classList.contains("dark") ? "dark" : "light";
            saveDB();
        });

        if (db.theme === "dark") document.body.classList.add("dark");

        function initHome() {
            const feat = db.products[0];
            if (feat) {
                document.getElementById("heroProductName").textContent = feat.name;
                document.getElementById("heroProductImage").src = feat.image;
            }
            const cats = ["All", "Electronics", "Software", "Home & Living", "Art & Craft", "Fashion", "Books", "Sports"];
            const catGrid = document.getElementById("categoryGrid");
            catGrid.innerHTML = cats.map(c => `
                <div class="category-card" onclick="filters.setCategory('${c}')">
                    <div class="category-icon">🛍️</div>
                    <span class="category-name">${c}</span>
                </div>
            `).join("");

            const sellerSelect = document.getElementById("sellerFilter");
            sellerSelect.innerHTML = `<option value="">All sellers</option>` + db.sellers.map(s => `<option value="${s.name}">${s.name}</option>`).join("");

            renderProducts(db.products);
            renderVendors();
        }

        function renderProducts(list) {
            const grid = document.getElementById("productGrid");
            document.getElementById("productCount").textContent = `${list.length} products available`;
            document.getElementById("resultSummary").textContent = `Showing ${list.length} catalog items`;

            if (list.length === 0) {
                grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-title">No products found</div><p class="empty-copy">Try adjusting your filters or search terms.</p></div>`;
                return;
            }

            grid.innerHTML = list.map(p => `
                <div class="product-card">
                    <button class="product-wish ${db.wishlist.includes(p.id) ? 'active' : ''}" onclick="store.toggleWishlist('${p.id}')">♥</button>
                    <button class="product-compare ${db.compare.includes(p.id) ? 'active' : ''}" onclick="store.toggleCompare('${p.id}')">⇄</button>
                    <div class="product-media" onclick="router.go('detail', '${p.id}')">
                        <img src="${p.image}" alt="${p.name}">
                    </div>
                    <div class="product-body" onclick="router.go('detail', '${p.id}')">
                        <div class="product-brand">${p.brand}</div>
                        <div class="product-name">${p.name}</div>
                        <div style="margin-top:5px"><span class="rating-pill">★ ${p.rating}</span></div>
                        <div style="display:flex;align-items:baseline;flex-wrap:wrap">
                            <span class="price">₹${p.price}</span>
                            <span class="mrp">₹${p.mrp}</span>
                            <span class="discount">${p.discount}</span>
                        </div>
                        <div class="product-seller">Sold by: ${p.seller}</div>
                    </div>
                    <div style="padding:0 13px 13px">
                        <button class="btn btn-primary" style="width:100%" onclick="store.addToCart('${p.id}')">Add to Cart</button>
                    </div>
                </div>
            `).join("");
        }

        function renderVendors() {
            const grid = document.getElementById("vendorGrid");
            grid.innerHTML = db.sellers.map(s => `
                <div class="seller-card">
                    <div class="seller-avatar">${s.name.charAt(0)}</div>
                    <div class="seller-name">${s.name}</div>
                    <div class="seller-meta">Rating: ★ ${s.rating} | Status: ${s.status}</div>
                    <div class="seller-buttons">
                        <button class="btn btn-outline" onclick="showToast('Viewing ${s.name} catalog')">View Store</button>
                        <button class="btn btn-primary" onclick="router.go('seller')">Seller Hub</button>
                    </div>
                </div>
            `).join("");
        }

        const store = {
            addToCart(id) {
                const prod = db.products.find(p => p.id === id);
                const item = db.cart.find(c => c.id === id);
                if (item) item.qty++;
                else db.cart.push({ ...prod, qty: 1 });
                saveDB();
                showToast(`Added ${prod.name} to cart`);
            },
            updateQty(id, delta) {
                const item = db.cart.find(c => c.id === id);
                if (!item) return;
                item.qty += delta;
                if (item.qty <= 0) db.cart = db.cart.filter(c => c.id !== id);
                saveDB();
                router.go('cart');
            },
            toggleWishlist(id) {
                if (db.wishlist.includes(id)) db.wishlist = db.wishlist.filter(i => i !== id);
                else db.wishlist.push(id);
                saveDB();
                initHome();
                showToast("Wishlist updated");
            },
            toggleCompare(id) {
                if (db.compare.includes(id)) db.compare = db.compare.filter(i => i !== id);
                else {
                    if (db.compare.length >= 4) { showToast("Max 4 products for comparison", "warning"); return; }
                    db.compare.push(id);
                }
                saveDB();
                initHome();
                showToast("Compare list updated");
            },
            search() {
                const q = document.getElementById("globalSearch").value.toLowerCase();
                const filtered = db.products.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
                renderProducts(filtered);
                router.scrollTo("productsSection");
            },
            loadDeals() {
                const deals = [...db.products].sort((a,b) => b.mrp - b.price - (a.mrp - a.price));
                renderProducts(deals);
            },
            sortByDiscount() {
                this.loadDeals();
                showToast("Sorted by best discounts");
            }
        };

        function renderCartPage() {
            const subtotal = db.cart.reduce((a,c) => a + c.price * c.qty, 0);
            const shipping = subtotal > 999 ? 0 : 99;
            const total = subtotal + shipping;

            return `
                <div class="page-shell container">
                    <h2 class="section-title">Shopping Cart (${db.cart.length} items)</h2>
                    ${db.cart.length === 0 ? `
                        <div class="empty panel" style="margin-top:20px">
                            <div class="empty-icon">🛒</div>
                            <div class="empty-title">Your cart is empty</div>
                            <button class="btn btn-primary" style="margin-top:15px" onclick="router.go('home')">Start Shopping</button>
                        </div>
                    ` : `
                        <div class="checkout-grid" style="margin-top:20px">
                            <div class="panel">
                                ${db.cart.map(item => `
                                    <div class="cart-line">
                                        <img src="${item.image}" alt="${item.name}">
                                        <div>
                                            <div class="cart-name">${item.name}</div>
                                            <div class="cart-meta">₹${item.price} x ${item.qty}</div>
                                            <div class="qty">
                                                <button onclick="store.updateQty('${item.id}', -1)">-</button>
                                                <span>${item.qty}</span>
                                                <button onclick="store.updateQty('${item.id}', 1)">+</button>
                                            </div>
                                        </div>
                                        <div style="font-weight:950">₹${item.price * item.qty}</div>
                                    </div>
                                `).join("")}
                            </div>
                            <div class="checkout-summary">
                                <h3>Order Summary</h3>
                                <div class="cart-totals" style="margin-top:15px">
                                    <div class="total-row"><span>Subtotal</span><span>₹${subtotal}</span></div>
                                    <div class="total-row"><span>Shipping (Shiprocket/Delhivery)</span><span>₹${shipping}</span></div>
                                    <div class="total-row grand"><span>Grand Total</span><span>₹${total}</span></div>
                                </div>
                                <button class="btn btn-primary" style="width:100%;margin-top:20px" onclick="router.go('checkout')">Proceed to Secure Checkout</button>
                            </div>
                        </div>
                    `}
                </div>
            `;
        }

        let paymentVerified = false;

        function renderCheckoutPage() {
            const subtotal = db.cart.reduce((a,c) => a + c.price * c.qty, 0);
            const shipping = subtotal > 999 ? 0 : 99;
            const total = subtotal + shipping;

            return `
                <div class="page-shell container">
                    <h2 class="section-title">Secure Checkout (Razorpay & UPI)</h2>
                    <div class="checkout-grid" style="margin-top:20px">
                        <div class="panel">
                            <h3>1. Shipping Details</h3>
                            <div class="form" style="margin-top:12px">
                                <div class="address-grid">
                                    <label>Full Name <input class="input" id="chkName" value="${db.user.name}"></label>
                                    <label>Phone Number <input class="input" id="chkPhone" value="${db.user.phone}"></label>
                                </div>
                                <label>Delivery Address <textarea class="input" id="chkAddress">Near Main Market, Jalore District, Rajasthan - 344001</textarea></label>
                                <div class="address-grid">
                                    <label>Pincode <input class="input" id="chkPin" value="${db.pincode}"></label>
                                    <label>Shipping Carrier <select class="select" id="chkCarrier"><option>Shiprocket Express</option><option>Delhivery Live</option><option>India Post SpeedPost</option></select></label>
                                </div>
                            </div>

                            <h3 style="margin-top:25px">2. Production Payment (Mandatory)</h3>
                            <p style="color:var(--muted);font-size:10px;margin-top:4px">Without verified payment, orders cannot be placed.</p>
                            
                            <div class="payment-card" style="margin-top:12px">
                                <label>
                                    <input type="radio" name="payMethod" checked>
                                    <span class="payment-title">Razorpay Production Link</span>
                                    <span class="payment-copy">Pay via official link: <a href="https://rzp.io/rzp/juTBnc4Q" target="_blank" style="color:var(--blue);text-decoration:underline">https://rzp.io/rzp/juTBnc4Q</a></span>
                                </label>
                                <label>
                                    <input type="radio" name="payMethod">
                                    <span class="payment-title">Direct UPI ID: 8233615852@ptaxis</span>
                                    <span class="payment-copy">Send exact amount ₹${total} to UPI ID and enter UTR below.</span>
                                </label>
                            </div>

                            <div style="margin-top:12px;padding:12px;background:var(--soft-blue);border-radius:9px">
                                <label style="font-size:10px;font-weight:900">Enter UTR / Transaction ID / Payment Reference:
                                    <input class="input" id="utrInput" placeholder="e.g. PAYID298347102" style="margin-top:5px">
                                </label>
                                <button class="btn btn-accent" style="margin-top:8px;width:100%" onclick="verifyPaymentGateway()">Verify Payment & Unlock Order Placement</button>
                                <div id="payStatusMsg" style="margin-top:6px;font-weight:900;font-size:10px;color:var(--red)">Payment Not Verified</div>
                            </div>
                        </div>

                        <div class="checkout-summary">
                            <h3>Order Total: ₹${total}</h3>
                            <button id="placeOrderBtn" class="btn btn-primary" style="width:100%;margin-top:20px" disabled onclick="executeOrderPlacement()">Place Order (Payment Required)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function verifyPaymentGateway() {
            const utr = document.getElementById("utrInput").value.trim();
            if (!utr) {
                showToast("Please enter valid UTR / Transaction ID or complete Razorpay payment.", "error");
                return;
            }
            paymentVerified = true;
            document.getElementById("payStatusMsg").innerHTML = `<span style="color:var(--green)">✓ Payment Verified Successfully (UTR: ${utr})</span>`;
            const btn = document.getElementById("placeOrderBtn");
            btn.disabled = false;
            btn.textContent = "Place Verified Order Now";
            showToast("Payment verified successfully via Razorpay/UPI!");
        }

        function executeOrderPlacement() {
            if (!paymentVerified) {
                showToast("Cannot place order without verified payment!", "error");
                return;
            }
            const subtotal = db.cart.reduce((a,c) => a + c.price * c.qty, 0);
            const shipping = subtotal > 999 ? 0 : 99;
            const total = subtotal + shipping;

            const newOrder = {
                id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString().split('T')[0],
                amount: total,
                status: "Processing (Paid)",
                paymentStatus: "Verified (Razorpay/UPI)",
                paymentId: "pay_" + Math.random().toString(36).substring(7),
                courier: document.getElementById("chkCarrier").value,
                trackingNo: "TRK" + Math.floor(10000000 + Math.random() * 90000000),
                items: [...db.cart]
            };

            db.orders.unshift(newOrder);
            db.notifications.unshift({
                id: Date.now(),
                title: "Order Placed Successfully",
                text: `Order ${newOrder.id} placed with verified payment. Live tracking active via ${newOrder.courier}.`,
                time: "Just now",
                unread: true
            });
            db.webhooks.unshift({
                id: "wh_" + Date.now(),
                event: "order.created",
                status: "Processed",
                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
                details: `Order ${newOrder.id} verified and dispatched via ${newOrder.courier}.`
            });

            db.cart = [];
            saveDB();
            showToast("Order placed successfully with live tracking!");
            router.go("account");
        }

        function renderAccountPage() {
            return `
                <div class="page-shell container">
                    <div class="account-layout">
                        <nav class="account-nav">
                            <button class="active">My Orders & Tracking</button>
                            <button onclick="router.go('admin')">Admin Console</button>
                            <button onclick="router.go('seller')">Seller Center</button>
                        </nav>
                        <div class="account-content">
                            <h2 class="section-title">Customer Account & Orders</h2>
                            <div style="margin-top:15px" class="data-list">
                                ${db.orders.length === 0 ? '<p>No orders placed yet.</p>' : db.orders.map(o => `
                                    <div class="data-item panel">
                                        <div style="display:flex;justify-content:space-between;align-items:center">
                                            <strong>Order: ${o.id}</strong>
                                            <span class="tag green">${o.status}</span>
                                        </div>
                                        <small>Date: ${o.date} | Amount: ₹${o.amount} \vert{} Payment:${o.paymentStatus}</small>
                                        <small>Courier: <b>${o.courier}</b> | Tracking No: <b style="color:var(--blue)">${o.trackingNo}</b></small>
                                        <div style="margin-top:8px">
                                            ${o.items.map(i => `${i.name} (x${i.qty})`).join(", ")}
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminPage() {
            return `
                <div class="admin-shell">
                    <aside class="admin-side">
                        <div class="admin-side-head">
                            <b>Admin Console</b>
                            <small>SRP Marketplace Management</small>
                        </div>
                        <div class="admin-nav">
                            <button class="active">Dashboard & Webhooks</button>
                            <button onclick="router.go('home')">Return to Store</button>
                        </div>
                    </aside>
                    <main class="admin-main">
                        <h2 class="admin-title">Server Webhooks & Order Monitoring</h2>
                        <p class="admin-copy">Live gateway verification logs and shipping synchronization.</p>
                        <div class="panel" style="margin-top:15px">
                            <h3>Webhook Event Stream</h3>
                            <div class="data-list" style="margin-top:10px">
                                ${db.webhooks.map(w => `
                                    <div class="data-item">
                                        <strong>Event: ${w.event} <span class="tag">${w.status}</span></strong>
                                        <small>Timestamp: ${w.timestamp}</small>
                                        <small>${w.details}</small>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function renderSellerPage() {
            return `
                <div class="seller-dashboard">
                    <aside class="seller-side">
                        <div class="seller-side-head">
                            <b>Seller Center</b>
                            <small>Multi-Vendor Hub</small>
                        </div>
                        <div class="seller-nav">
                            <button class="active">Products & Inventory</button>
                            <button onclick="router.go('home')">Return to Store</button>
                        </div>
                    </aside>
                    <main class="seller-main">
                        <h2 class="seller-page-title">Seller Inventory & Orders</h2>
                        <p class="seller-status">Active Store: SRP Official Store | Approved</p>
                        <div class="panel" style="margin-top:15px">
                            <h3>Catalog Items</h3>
                            <div class="data-list" style="margin-top:10px">
                                ${db.products.map(p => `
                                    <div class="data-item">
                                        <strong>${p.name} - ₹${p.price}</strong>
                                        <small>Seller: ${p.seller} \vert{} Stock:${p.stock}</small>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function renderDetailPage(id) {
            const p = db.products.find(x => x.id === id) || db.products[0];
            return `
                <div class="page-shell container">
                    <div class="product-detail">
                        <div class="main-image"><img src="${p.image}" alt="${p.name}"></div>
                        <div>
                            <div class="detail-brand">${p.brand}</div>
                            <h1 class="detail-title">${p.name}</h1>
                            <p class="detail-copy">${p.description}</p>
                            <div class="detail-price">₹${p.price} <span class="mrp">₹${p.mrp}</span></div>
                            <div class="detail-actions" style="margin-top:20px">
                                <button class="btn btn-primary" onclick="store.addToCart('${p.id}')">Add to Cart</button>
                                <button class="btn btn-accent" onclick="router.go('cart')">Go to Checkout</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        const filters = {
            setCategory(c) {
                if (c === "All") renderProducts(db.products);
                else renderProducts(db.products.filter(p => p.category === c));
                router.scrollTo("productsSection");
            },
            apply() {
                const min = parseFloat(document.getElementById("minPrice").value) || 0;
                const max = parseFloat(document.getElementById("maxPrice").value) || Infinity;
                const seller = document.getElementById("sellerFilter").value;
                const filtered = db.products.filter(p => p.price >= min && p.price <= max && (!seller || p.seller === seller));
                renderProducts(filtered);
                router.scrollTo("productsSection");
            },
            clear() {
                document.getElementById("minPrice").value = "";
                document.getElementById("maxPrice").value = "";
                document.getElementById("sellerFilter").value = "";
                renderProducts(db.products);
            },
            openMobile() {
                router.scrollTo("productsSection");
            }
        };

        router.go("home");
        updateBadges();
    </script>
</body>
</html>
